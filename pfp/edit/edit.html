<!DOCTYPE html>
<html lang="en">
<head>
        <link rel="stylesheet" href="../style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
</head>
<body>
    <div id="header">
        <a href="../profile.html" id="editProfile">
            <img src="../resc/pfp.png" alt="Profile">
        </a>
        <div id="options">
            <a href="../search/search.html" id="search">
                <img src="../resc/search.png" alt="Search">
            </a>
            <a href="../settings/settings.html" id="out">
                <img src="../resc/settings.png" alt="Settings">
            </a>
            <a href="../../index.html" id="out">
                <img src="../resc/logout.png" alt="Logout">
            </a>
        </div>
    </div>

    <div id="work">
        <div class="page-shell">
            <div class="simple-panel">
                <h1>Edit profile</h1>
                <p>Update your username. Documents created under your account will move with it.</p>

                <p>Current username: <strong id="currentUsername">Loading...</strong></p>

                <form id="editForm">
                    <div class="field-group">
                        <label for="newUsername">New username</label>
                        <input id="newUsername" type="text" maxlength="32" placeholder="Enter a new username">
                    </div>

                    <div class="actions-row">
                        <button id="saveUsernameBtn" type="submit">Save changes</button>
                        <button id="cancelEditBtn" type="button">Cancel</button>
                    </div>
                </form>

                <div id="editStatus" class="status-line"></div>
            </div>
        </div>
    </div>

    <script src="editFrontend.js"></script>
</body>
</html>
