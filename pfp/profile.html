<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
</head>
<body>
  <div id="header">
    <a href="edit/edit.html" id="editProfile">
      <img src="resc/pfp.png">
    </a>
    <div id="options">
      <a href="search/search.html" id="search">
        <img src="resc/search.png">
      </a>
      <a href="settings/settings.html" id="out">
        <img src="resc/settings.png">
      </a>
      <a href="../index.html" id="out">
        <img src="resc/logout.png">
      </a>
    </div>
  </div>
  <div id="work">
    <div id="profilePanel">
      <div id="profileCard">
        <p id="profileText">Loading profile...</p>
      </div>

      <div id="documentsPanel">
        <div class="panelHeader">
          <h2>Documents</h2>
          <button id="newDocumentBtn" type="button">New document?</button>
        </div>

        <form id="documentForm" class="hidden">
          <input id="documentTitle" type="text" placeholder="Document title" maxlength="120" />
          <textarea id="documentContent" rows="6" placeholder="Write your document..."></textarea>
          <div class="formActions">
            <button type="submit">Save document</button>
            <button id="cancelDocumentBtn" type="button">Cancel</button>
          </div>
        </form>

        <div id="documentStatus"></div>
        <div id="documentList"></div>
      </div>
    </div>
  </div>
  <script src="profileFrontend.js"></script>
</body>
</html>
