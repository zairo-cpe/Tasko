<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, Arial, sans-serif;
      background: #eef2ff;
      color: #1f2937;
    }
    .profile-card {
      width: min(460px, 100%);
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      text-align: center;
    }
    .profile-card h1 {
      margin: 0 0 14px;
      font-size: 2rem;
    }
    .profile-card p {
      margin: 0 0 24px;
      color: #4b5563;
      line-height: 1.7;
    }
    .profile-card a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .profile-card a:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <article class="profile-card">
    <h1>Profile</h1>
    <p id="profileText">Checking login details...</p>
    <a href="../login.html">Back to Login</a>
  </article>
  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username') || params.get('user');
    const profileText = document.getElementById('profileText');
    if (username) {
      profileText.textContent = `Signed in as ${username}.`;
    } else {
      profileText.innerHTML = 'No user information found. Please <a href="../login.html">sign in</a> again.';
    }
  </script>
</body>
</html>
